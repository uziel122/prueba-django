{% extends "inicio/encabezado.html" %}

{% block titulo %}REGISTRAR{% endblock %}

{% block encabezado_pagina %}
<div class="page-header">
    <div class="page-title">
        <h3>
            Registro
            <small>Ingresa tu información</small>
        </h3>
    </div>
</div>
{% endblock %}

{% block contenido %}

<form method="POST" action="">
    {% csrf_token %}

    <div class="panel panel-default">
        <div class="panel-body">

            <!-- Django genera los inputs de matricula, nombre, carrera y turno -->
            {{ form.as_p }}

            <div class="form-actions text-right">
                <button type="submit" class="btn btn-primary">
                    Enviar
                </button>
            </div>

        </div>
    </div>

</form>

{% endblock %}
