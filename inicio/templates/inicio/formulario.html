{% extends "inicio/encabezado.html" %}

{% block titulo %}REGISTRAR{% endblock %}

{% block encabezado_pagina %}
<div class="page-header">
    <div class="page-title">
        <h3>
            Registro
            <small>Ingresa tu información</small>
        </h3>
    </div>
</div>
{% endblock %}

{% block contenido %}

<form method="POST" action="">
    {% csrf_token %}

    <div class="panel panel-default">
        <div class="panel-body">

            <div class="form-group">
                <label class="col-sm-2 control-label text-right">
                    Matrícula:
                </label>
                <div class="col-sm-10">
                    <input type="text"
                           class="form-control"
                           name="matricula"
                           required>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label text-right">
                    Nombre:
                </label>
                <div class="col-sm-10">
                    <input type="text"
                           class="form-control"
                           name="nombre"
                           required>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label text-right">
                    Carrera:
                </label>
                <div class="col-sm-10">
                    <select class="form-control" name="carrera" required>
                        <option value="">Seleccione una carrera</option>
                        <option value="TIC">TIC</option>
                        <option value="BIO">BIO</option>
                        <option value="MAI">MAI</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label text-right">
                    Turno:
                </label>

                <div class="col-sm-10">
                    <label>
                        <input type="radio"
                               name="turno"
                               value="Matutino"
                               checked>
                        Matutino
                    </label>

                    &nbsp;&nbsp;&nbsp;

                    <label>
                        <input type="radio"
                               name="turno"
                               value="Vespertino">
                        Vespertino
                    </label>
                </div>
            </div>

            <div class="form-actions text-right">
                <button type="submit" class="btn btn-primary">
                    Enviar
                </button>
            </div>

        </div>
    </div>

</form>

{% endblock %}
